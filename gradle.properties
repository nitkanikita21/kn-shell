# Gradle JVM — G1GC (Gradle's recommended collector) + headroom for the Kotlin and
# Kotlin/Native compile daemons that run alongside it.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
# Keep the daemon alive across builds (default is on; pinned explicitly so it is
# never disabled by an inherited ~/.gradle/gradle.properties).
org.gradle.daemon=true
# Reuse task outputs and store a configuration cache so the no-op build is ~2-3s.
# Both already enabled; stated here so the settings are not lost on a fresh clone.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Watch the VFS so Gradle knows precisely which files changed between builds.
org.gradle.vfs.watch=true
# This box has 16 cores / 31 GB. Cap Gradle workers so the K/N compiler, the Cargo
# build and the running compositor/watcher keep enough headroom (not all 16).
org.gradle.workers.max=12

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.incremental.native=true

# Kotlin/Native compiler daemon: keep it warm (the K/N toolchain is expensive to
# start) and give it enough heap for the framework module on a 31 GB box.
kotlin.native.konanDaemon=enabled
kotlin.native.jvmArgs=-Xmx3g -XX:MaxMetaspaceSize=512m
