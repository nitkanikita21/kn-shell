[package]
name = "palette-core"
version = "0.1.0"
edition = "2021"
description = "Wallpaper palette extraction: file -> dominant OKLCH colors, cached by file hash."
license = "MIT"
repository = "https://example.com/kn-shell/palette-core"
readme = "README.md"

[lib]
name = "palette_core"
# `lib` -> rlib (consumed by rust-core under the `custom-host` feature); `staticlib`
# -> native archive linked into the Kotlin/Native executable, mirroring rust-core.
crate-type = ["lib", "staticlib"]

[dependencies]
# Decode JPEG/PNG/WebP. `image` 0.25 uses a pure-Rust WebP decoder (image-webp),
# so no system libwebp is required.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
kamadak-exif = "0.6"     # EXIF orientation for JPEG
directories = "5"        # XDG cache dir
thiserror = "2"

# Optional bridge into the rust-core `custom` extension host. Off by default so the
# core engine has no rust-core dependency and builds without it.
kn_shell_core = { path = "../rust-core", optional = true }

[features]
default = []
custom-host = ["dep:kn_shell_core"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "extract"
harness = false
test = false

# Dev loop: the debug staticlib is linked into the Kotlin/Native executable and
# re-linked on every Kotlin change. A 128 MB DWARF-laden archive makes that final
# link slow, so for debug we drop debug info and parallelise codegen. Release keeps
# full optimisation + thin LTO (used by `./scripts/run.sh`).
[profile.dev]
debug = false
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
