[package]
name = "atlas-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP daemon that drives the Atlas component catalog on a private headless display"

[dependencies]
# The private display of a hidden atlas.
headless-compositor = { path = "../../headless-compositor" }
rmcp = { version = "3.12.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "time", "sync", "signal"] }
serde_json = "1.0.154"
libc = "0.2.191"
