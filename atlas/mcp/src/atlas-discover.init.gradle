// Part of atlas-mcp, handed to Gradle with `-I`: the project itself needs no change.
//
// An atlas is a module that applies the `dev.knshell.atlas` plugin and has its run task
// (`runAtlas<BuildType>Executable<Target>`). Modules without the plugin are not reported, even when
// they have a task of that name. Each atlas is reported as a `KN_ATLAS {json}` line.
import groovy.json.JsonOutput

allprojects {
    tasks.register('knAtlasDescribe') {
        def owner = project
        doLast {
            if (!owner.plugins.hasPlugin('dev.knshell.atlas')) return
            owner.tasks.matching { it.name ==~ /runAtlas\w*ExecutableLinux\w+/ }.each { run ->
                def link = run.taskDependencies.getDependencies(run).find { it.name.startsWith('link') }
                if (link == null) return
                // Only modules built with Kotlin can end up in the binary: a tool module next to
                // them (a Rust daemon, say) must not make the atlas look out of date.
                def modules = owner.rootProject.allprojects.findAll { module ->
                    module.plugins.any { it.class.name.startsWith('org.jetbrains.kotlin') }
                }
                println 'KN_ATLAS ' + JsonOutput.toJson([
                    module     : owner.path,
                    linkTask   : link.path,
                    executable : run.executable,
                    workingDir : run.workingDir.absolutePath,
                    // What the binary may be built from: every module's sources and build scripts.
                    sourceDirs : modules.collect { new File(it.projectDir, 'src') }.findAll { it.isDirectory() }*.absolutePath,
                    projectDirs: modules*.projectDir*.absolutePath,
                ])
            }
        }
    }
}
